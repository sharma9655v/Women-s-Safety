[project]
name = "map-for-women-research"
version = "0.1.0"
description = "Phase 7 experiments: baselines, stress tests, lifecycle, ablation, calibration. Every claimed number is produced by a recorded run."
requires-python = ">=3.12"
dependencies = [
    "api",
]

[tool.uv.sources]
api = { path = "../apps/api" }

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.setuptools]
packages = ["research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]