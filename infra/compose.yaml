name: map-for-women

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: mapforwomen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mapforwomen"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  osrm:
    build: ./osrm
    environment:
      # Small extract by default for a fast dev bootstrap (covers Delhi).
      # For the India-wide graph set:
      #   OSM_PBF_URL=https://download.geofabrik.de/asia/india-latest.osm.pbf
      OSM_PBF_URL: ${OSM_PBF_URL:-https://download.geofabrik.de/asia/india/northern-zone-latest.osm.pbf}
    ports:
      - "5000:5000"
    volumes:
      - osrmdata:/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/.osrm-ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ../apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgis:5432/mapforwomen
      REDIS_URL: redis://redis:6379/0
      OSRM_BASE_URL: http://osrm:5000
      # Offline-demo fallback: if PostGIS is unreachable, the API serves the
      # seeded demo-evidence snapshot from memory (see evidence/registry.py).
      EVIDENCE_SEED_JSON: /app/data/processed/demo-evidence.json
    volumes:
      - ../data:/app/data:ro
    ports:
      - "8000:8000"
    depends_on:
      postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
      osrm:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  osrmdata: